<title>Sovereign Complete Progress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a field-guide ledger. A header band, tabs, then one column of tables and a block-by-block overworld. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunk: #e3e8ee;
  --ink: #17202b;
  --muted: #566273;
  --line: #cfd7e1;
  --accent: #2b4fa3;
  --johto: #b8860b;
  --johto-soft: #f2e2b3;
  --kanto: #c23b32;
  --kanto-soft: #f4cfcb;
  --other: #7d8796;
  --other-soft: #dde2e8;
  --ok: #217a4b;
  --ok-soft: #d4ecdf;
  --warn: #a8590d;
  --warn-soft: #f6e0c8;
  --info: #2b4fa3;
  --info-soft: #d9e2f5;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #19202a; --sunk: #222b37; --ink: #e6ebf1; --muted: #9aa6b6; --line: #2f3a48;
    --accent: #8fb0f5; --johto: #e3b341; --johto-soft: #4a3d17; --kanto: #f0776d; --kanto-soft: #4f2421;
    --other: #9aa3b1; --other-soft: #2c3440; --ok: #6fcf97; --ok-soft: #1d3a2b; --warn: #f2a65a; --warn-soft: #43301a;
    --info: #8fb0f5; --info-soft: #233150; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #19202a; --sunk: #222b37; --ink: #e6ebf1; --muted: #9aa6b6; --line: #2f3a48;
  --accent: #8fb0f5; --johto: #e3b341; --johto-soft: #4a3d17; --kanto: #f0776d; --kanto-soft: #4f2421;
  --other: #9aa3b1; --other-soft: #2c3440; --ok: #6fcf97; --ok-soft: #1d3a2b; --warn: #f2a65a; --warn-soft: #43301a;
  --info: #8fb0f5; --info-soft: #233150; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.band { background: var(--surface); border-bottom: 1px solid var(--line); }
header.band .wrap { padding-block: 22px 0; display: grid; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 42px); line-height: 1.05; margin: 0;
  letter-spacing: .01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
nav.tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .02em; text-decoration: none;
  color: var(--muted); padding: 8px 14px 10px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
main .wrap { padding-block: 26px 48px; display: grid; gap: 34px; }
section { display: grid; gap: 12px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 600; font-size: 25px; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
p { margin: 0; max-width: 72ch; }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  font-weight: 600; background: var(--sunk); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.s-done { background: var(--ok-soft); color: var(--ok); }
.s-mostly { background: var(--ok-soft); color: var(--ok); outline: 1px dashed var(--ok); outline-offset: -1px; }
.s-active { background: var(--info-soft); color: var(--info); }
.s-waiting { background: var(--warn-soft); color: var(--warn); }
.s-ready { background: var(--johto-soft); color: var(--ink); }
.s-later { background: var(--other-soft); color: var(--muted); }
.r-johto { background: var(--johto-soft); color: var(--ink); }
.r-kanto { background: var(--kanto-soft); color: var(--ink); }
.r-other { background: var(--other-soft); color: var(--muted); }
.meter { display: grid; gap: 6px; }
.bar { height: 10px; background: var(--sunk); border-radius: 999px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.minibar { width: 64px; height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; display: inline-block;
  vertical-align: middle; margin-left: 8px; }
.minibar span { display: block; height: 100%; background: var(--ok); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 2px; }
.tile .big { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; }
.tile .lbl { font-size: 13px; color: var(--muted); }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 76ch; }
.decisions { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.decision { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); padding: 10px 14px;
  display: grid; gap: 4px; min-width: 0; }
.decision b { font-family: var(--display); font-size: 18px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; border-radius: 2px; }
.mapbox { background: var(--surface); border: 1px solid var(--line); padding: 10px; overflow-x: auto; }
.mapbox svg { display: block; min-width: 640px; width: 100%; height: auto; }
.mapbox rect.cell { stroke: var(--surface); stroke-width: .6; }
.mapbox rect.cell:hover { stroke: var(--ink); stroke-width: 1.4; }
.tip { font-size: 13px; min-height: 1.5em; color: var(--muted); }
.tip b { color: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); min-width: 0; width: 220px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 3px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
details summary { cursor: pointer; }
details .maplist { margin-top: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px; }
.part { background: var(--surface); border: 1px solid var(--line); padding: 7px 10px; display: grid;
  grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline; min-width: 0; }
.part .idx { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.part .nm { min-width: 0; }
.part .end { display: block; font-size: 12px; color: var(--muted); }
.tick { font-family: var(--mono); font-size: 12px; color: var(--ok); white-space: nowrap; }
.tick.no { color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) { th, td { padding: 8px 9px; } .hide-sm { display: none; } }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width .4s ease; } }
</style>

<header class="band">
  <div class="wrap">
    <span class="eyebrow" id="status-line">Status</span>
    <h1>Sovereign Complete Progress</h1>
    <p class="lede">Johto and Kanto joining Sovereign Platinum: where each step stands, what's waiting on you, every map
      brought over, and how far a new game plays through.</p>
    <nav class="tabs" aria-label="Views">
      <a href="#whole-game" data-tab="whole-game">Whole game</a>
      <a href="#since-yesterday" data-tab="since-yesterday">Since yesterday</a>
      <a href="#maps" data-tab="maps">Maps &amp; routes</a>
      <a href="#story" data-tab="story">Story test</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap" id="view-whole-game" data-view="whole-game"></div>
  <div class="wrap" id="view-since-yesterday" data-view="since-yesterday" hidden></div>
  <div class="wrap" id="view-maps" data-view="maps" hidden></div>
  <div class="wrap" id="view-story" data-view="story" hidden></div>
</main>

<script>
const DATA = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const REGION = { johto: 'Johto', kanto: 'Kanto', other: 'Unused' };
const KIND = { town: 'Town', route: 'Route', place: 'Place', other: 'Other' };

document.getElementById('status-line').textContent =
  `Updated ${DATA.updated} · ${DATA.totals.maps} maps · ${DATA.totals.passed} of ${DATA.totals.parts} story parts passed`;

function wholeGame() {
  const t = DATA.totals;
  const rows = DATA.steps.map(s => `<tr><td class="n">${s.n}</td><td><b>${esc(s.name)}</b></td>
    <td><span class="pill s-${s.status}">${esc(s.label)}</span></td><td>${esc(s.detail)}</td></tr>`).join('');
  return `
  <section>
    <h2>Where it stands</h2>
    <div class="tiles">
      <div class="tile"><span class="big num">${t.maps}</span><span class="lbl">Johto and Kanto maps in the game</span></div>
      <div class="tile"><span class="big num">${t.trainers}</span><span class="lbl">trainers placed on them</span></div>
      <div class="tile"><span class="big num">${t.wild}</span><span class="lbl">maps with wild Pokémon</span></div>
      <div class="tile"><span class="big num">${t.passed}/${t.parts}</span><span class="lbl">story parts passed, bedroom to Canalave</span></div>
    </div>
  </section>
  <section>
    <h2>Progress by step</h2>
    <div class="scroll"><table>
      <thead><tr><th class="n">#</th><th>Step</th><th>Status</th><th>What that means</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>
  <section>
    <h2>Next up</h2>
    <ul class="plain">${DATA.next.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
  </section>
  <section>
    <h2>Waiting on you</h2>
    <div class="decisions">${DATA.waiting.map(w => `<div class="decision"><b>${esc(w.topic)}</b>
      <span class="muted">${esc(w.detail)}</span></div>`).join('')}</div>
  </section>
  <p class="foot">Built from the repo on ${esc(DATA.generated)} by tools/complete/progress_page.py.</p>`;
}

function sinceYesterday() {
  return DATA.recent.map(g => `<section><h2>${esc(g.title)}</h2>
    <ul class="plain">${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></section>`).join('') +
    `<p class="foot">The full log is docs/Progress.md in the repo.</p>`;
}

function overworldSvg() {
  const grid = DATA.overworld, rows = grid.length, cols = grid[0].length, S = 20;
  const placeBy = {};
  DATA.places.forEach((p, i) => p.maps.forEach(m => { placeBy[m.name] = p; }));
  let cells = '';
  grid.forEach((row, r) => row.forEach((c, k) => {
    if (!c) return;
    const p = placeBy[c[0]];
    const region = p ? p.region : 'other';
    const fill = c[2] ? `var(--${region})` : `var(--${region}-soft)`;
    cells += `<rect class="cell" x="${k * S}" y="${r * S}" width="${S}" height="${S}" fill="${fill}"
      data-map="${esc(c[0])}" data-place="${esc(p ? p.name : '')}" data-walked="${c[2] ? 1 : 0}"></rect>`;
  }));
  return `<svg viewBox="0 0 ${cols * S} ${rows * S}" role="img"
    aria-label="Johto and Kanto's overworld, one square per 32 by 32 tile block, coloured by region and by whether the story test walks it">${cells}</svg>`;
}

let regionFilter = 'all', query = '';
function placeRows() {
  const q = query.trim().toLowerCase();
  return DATA.places.filter(p => (regionFilter === 'all' || p.region === regionFilter) &&
    (!q || p.name.toLowerCase().includes(q) || p.maps.some(m => m.name.toLowerCase().includes(q.replace(/ /g, '_')))))
    .map(p => {
      const n = p.maps.length;
      const parts = p.parts.length ? `<div class="chips">${p.parts.slice(0, 4).map(x => `<span class="chip">${esc(x)}</span>`).join('')}${p.parts.length > 4 ? `<span class="chip">+${p.parts.length - 4}</span>` : ''}</div>` : '<span class="muted">Not walked yet</span>';
      return `<tr>
        <td><details><summary><b>${esc(p.name)}</b></summary><div class="maplist">${p.maps.map(m =>
          `<span>${esc(m.name)}${m.walked.length ? ' ✓' : ''}</span>`).join('')}</div></details></td>
        <td><span class="pill r-${p.region}">${REGION[p.region]}</span></td>
        <td class="hide-sm">${KIND[p.kind]}</td>
        <td class="n">${n}</td>
        <td class="n">${p.walkedMaps}/${n}<span class="minibar" aria-hidden="true"><span style="width:${pct(p.walkedMaps, n)}%"></span></span></td>
        <td class="n hide-sm">${p.trainers}</td><td class="n hide-sm">${p.items}</td><td class="n hide-sm">${p.wild}</td>
        <td>${parts}</td></tr>`;
    }).join('') || `<tr><td colspan="9" class="muted">No place matches “${esc(query)}”.</td></tr>`;
}

function maps() {
  const regionTiles = DATA.regions.map(r => `<div class="tile">
      <span class="lbl"><span class="pill r-${r.region}">${REGION[r.region]}</span></span>
      <span class="big num">${r.maps}</span><span class="lbl">maps in ${r.places} places</span>
      <div class="meter"><div class="bar" aria-hidden="true"><span style="width:${pct(r.walked, r.maps)}%;background:var(--${r.region})"></span></div>
      <span class="lbl num">${r.walked} maps (${pct(r.walked, r.maps)}%) walked by the story test · ${r.placesWalked} of ${r.places} places</span></div>
      <span class="lbl num">${r.trainers} trainers · ${r.items} item balls · ${r.wild} maps with wild Pokémon</span>
    </div>`).join('');
  return `
  <section>
    <h2>The maps brought over</h2>
    <p class="muted">Every HeartGold map is in the game, with Sacred Gold's people, trainers, items and wild Pokémon,
      and every one loads in the visit-every-map test. “Walked” means the story test passes through it on its way
      from the bedroom to Canalave City; most of the rest are optional rooms and side areas.</p>
    <div class="tiles">${regionTiles}</div>
  </section>
  <section>
    <h2>The overworld, block by block</h2>
    <div class="legend">
      <span><i class="sw" style="background:var(--johto)"></i>Johto, walked</span>
      <span><i class="sw" style="background:var(--johto-soft)"></i>Johto, not walked</span>
      <span><i class="sw" style="background:var(--kanto)"></i>Kanto, walked</span>
      <span><i class="sw" style="background:var(--kanto-soft)"></i>Kanto, not walked</span>
    </div>
    <div class="mapbox" id="mapbox">${overworldSvg()}</div>
    <div class="tip" id="maptip">Point at a block to see its place and map.</div>
  </section>
  <section>
    <h2>Towns, routes and places</h2>
    <div class="controls">
      <div class="seg" role="group" aria-label="Region">
        ${['all', 'johto', 'kanto', 'other'].map(r => `<button type="button" data-region="${r}" aria-pressed="${r === regionFilter}">${r === 'all' ? 'All' : REGION[r]}</button>`).join('')}
      </div>
      <input type="search" id="place-search" placeholder="Find a place or map" aria-label="Find a place or map" value="${esc(query)}">
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Place</th><th>Region</th><th class="hide-sm">Kind</th><th class="n">Maps</th><th class="n">Walked</th>
        <th class="n hide-sm">Trainers</th><th class="n hide-sm">Items</th><th class="n hide-sm">Wild</th><th>Story parts through it</th></tr></thead>
      <tbody id="place-rows">${placeRows()}</tbody></table></div>
  </section>`;
}

function story() {
  const t = DATA.totals;
  const groups = [['Johto, to the Hall of Fame', 1, 70], ['To Kanto by the S.S. Aqua', 71, 74], ['Kanto, to the ship for Sinnoh', 75, 95]];
  return `
  <section>
    <h2>A new game, played through</h2>
    <p class="muted">tools/complete/test_hgss_opening.py plays from the player's room in New Bark Town as a player would,
      part by part: walks, talks, battles and puzzles, with no test warps. Each part has passed from the end of the one
      before. A single run of every part in one go is under way.</p>
    <div class="tiles">
      <div class="tile"><span class="big num">${t.passed}/${t.parts}</span><span class="lbl">parts passed, each from the one before</span>
        <div class="bar" aria-hidden="true"><span style="width:${pct(t.passed, t.parts)}%;background:var(--ok)"></span></div></div>
      <div class="tile"><span class="big num">${t.single}/${t.parts}</span><span class="lbl">passed so far in the single run from the bedroom</span>
        <div class="bar" aria-hidden="true"><span style="width:${pct(t.single, t.parts)}%;background:var(--accent)"></span></div></div>
    </div>
  </section>
  ${groups.map(([title, a, b]) => `<section><h3>${esc(title)} <span class="muted num">(${a}–${b})</span></h3>
    <div class="parts">${DATA.story.filter(s => s.n >= a && s.n <= b).map(s => `<div class="part">
      <span class="idx num">${s.n}</span>
      <span class="nm">${esc(s.name)}<span class="end">ends in ${esc(s.end)}</span></span>
      <span class="tick ${s.passed ? '' : 'no'}" title="${s.single ? 'Passed in the single run too' : ''}">${s.passed ? (s.single ? '✓✓' : '✓') : '·'}</span>
    </div>`).join('')}</div></section>`).join('')}
  <p class="foot">✓ passed from the part before · ✓✓ also passed in the single run from the bedroom.</p>`;
}

const views = { 'whole-game': wholeGame, 'since-yesterday': sinceYesterday, maps, story };
const rendered = {};
function show() {
  const name = (location.hash || '#whole-game').slice(1);
  const tab = views[name] ? name : 'whole-game';
  document.querySelectorAll('[data-view]').forEach(v => { v.hidden = v.dataset.view !== tab; });
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
  if (!rendered[tab]) {
    document.getElementById('view-' + tab).innerHTML = views[tab]();
    rendered[tab] = true;
    if (tab === 'maps') wireMaps();
  }
}
function wireMaps() {
  const tip = document.getElementById('maptip');
  document.getElementById('mapbox').addEventListener('mouseover', e => {
    const c = e.target.closest('rect.cell');
    if (!c) return;
    tip.innerHTML = `<b>${esc(c.dataset.place || 'No place')}</b> · ${esc(c.dataset.map)} · ${c.dataset.walked === '1' ? 'walked by the story test' : 'not walked by the story test'}`;
  });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    regionFilter = b.dataset.region;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    document.getElementById('place-rows').innerHTML = placeRows();
  }));
  document.getElementById('place-search').addEventListener('input', e => {
    query = e.target.value;
    document.getElementById('place-rows').innerHTML = placeRows();
  });
}
window.addEventListener('hashchange', show);
show();
</script>
