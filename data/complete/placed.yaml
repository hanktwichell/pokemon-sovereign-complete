# The Legend Archivist's lines (Canalave Library 2F) that say where the moved legendaries are, by message ID after
# CanalaveLibrary2F_Text_SovereignArchivist: gen_placed.py writes them into decomp/res/text/canalave_library_2f.json
texts:
  Intro: ["Ah, you must be the new Champion!\r", "I’m the Legend Archivist. I look after\n",
          "this library’s oldest records.\r", "Since your Hall of Fame entry, people\n",
          "have seen Pokémon new to our lands.\r", "I found them in this tome, the Unova\n",
          "Chronicle. Unova is a faraway land.\r", "Its legends tell of three Pokémon\n",
          "who stood together like swords.\r", "And now one of them, VIRIZION, has\n",
          "been seen in Johto, in Ilex Forest.\r", "How could a Pokémon of Unova come\n",
          "here? I can’t make sense of it.\r", "Would you look into it for me?\n", "I’ll keep reading the Chronicle."]
  Swords: ["The Chronicle names all three swords:\n", "COBALION, TERRAKION and VIRIZION.\r",
           "They never stray far from each other,\n", "and now all three are in Johto.\r",
           "Here’s where they’ve been seen:\r"]
  Cobalion: ["COBALION: deep in Mt. Mortar,\n", "on its lowest floor.\r"]
  Terrakion: ["TERRAKION: in Dark Cave, in the\n", "part that opens onto Route 45.\r"]
  Virizion: ["VIRIZION: deep in Ilex Forest,\n", "south of Goldenrod City.\r"]
  Keldeo: ["You found all three swords!\r", "The Chronicle tells of a fourth one,\n", "a young Pokémon named KELDEO.\r",
           "It followed the three swords to learn\n", "from them, and became a sword itself.\r",
           "They say it comes to the water when\n", "the three swords are near.\r",
           "The Lake of Rage, perhaps? Go with\n", "COBALION, TERRAKION and VIRIZION.\r"]
  KeldeoCaught: ["KELDEO too! All four swords of Unova,\n", "found at last...\r"]
  Reshiram: ["RESHIRAM: the LIGHT STONE is warm,\n", "like a fire. Try the Burned Tower.\r"]
  Zekrom: ["ZEKROM: the DARK STONE crackles.\n", "Try Dragon’s Den in Johto, at night.\r"]
  Kyurem: ["RESHIRAM and ZEKROM, both here!\r", "The Chronicle tells of a third dragon,\n",
           "KYUREM, left empty when they split.\r", "It sleeps in the ice. Try the icy\n",
           "depths of the Ice Path in Johto.\r"]
  ForcesRelease: ["The Chronicle also tells of TORNADUS\n", "and THUNDURUS, who ride the clouds.\r",
                  "Have you felt the wild winds and the\n", "storms lately? They must be here!\r",
                  "They never stay in one place. Look\n", "for them all over Johto.\r"]
  Roamers: ["TORNADUS and THUNDURUS roam all\n", "over Johto.\r"]
  Landorus: ["LANDORUS, lord of the land, once\n", "stopped the two of them.\r",
             "Take TORNADUS and THUNDURUS to\n", "Route 46 in Johto, and see!\r"]
  Enamorus: ["And ENAMORUS, who brings the spring...\r", "They say it waits among the trees\n",
             "of Route 43.\r"]
  Victini: ["And of VICTINI, who brings victory\n", "to those it likes.\r", "It loves a view of the sea. Try\n",
            "high up in Olivine’s Lighthouse.\r"]
  Xerneas: ["XERNEAS: on Route 37 in Johto,\n", "among the trees.\r"]
  Yveltal: ["YVELTAL: on the mountain paths\n", "of Route 45.\r"]
  Zygarde: ["XERNEAS and YVELTAL, both here!\r", "The Chronicle tells of a third one,\n",
            "ZYGARDE, who keeps them in order.\r", "It watches from deep below. Try the\n",
            "lowest floor of Union Cave.\r"]
  Diancie: ["The Chronicle also tells of DIANCIE,\n", "a jewel born among CARBINK.\r",
            "A CARBINK might lead you to\n", "it, deep in Cliff Cave.\r", "CARBINK live outside Stark Mountain.\r"]
  Hoopa: ["HOOPA: they say it plays among\n", "the Ruins of Alph.\r", "Take the PRISON BOTTLE there!\r"]
  Volcanion: ["And of VOLCANION, who lives in heat\n", "and steam.\r", "Try the cliffs of Route 47,\n",
              "west of Cianwood City.\r"]
  TapuKoko: ["TAPU KOKO: on Route 10 in Kanto,\n", "by the Power Plant.\r"]
  TapuLele: ["TAPU LELE: in Lavender Town,\n", "in Kanto.\r"]
  TapuBulu: ["TAPU BULU: deep in Viridian\n", "Forest.\r"]
  TapuFini: ["TAPU FINI: on the shore of\n", "Route 19, south of Fuchsia City.\r"]
  Magearna: ["MAGEARNA: an old automaton in\n", "Silph Co. in Saffron City.\r"]
  Marshadow: ["MARSHADOW: in the shadows of\n", "Rock Tunnel.\r"]
  Zeraora: ["ZERAORA: it runs all over\n", "Kanto like lightning.\r"]
  Meltan: ["MELTAN: somewhere in\n", "Mt. Moon.\r"]
  Melmetal: ["MELMETAL: it comes to Mt. Moon\n", "once you catch MELTAN.\r"]
  Zacian: ["The Chronicle tells of two heroes,\n", "a sword and a shield.\r", "ZACIAN, the sword, waits on\n",
           "Route 2, north of Viridian City.\r"]
  Zamazenta: ["ZAMAZENTA, the shield, has come to\n", "Route 2 now.\r"]
  Eternatus: ["Both heroes! The Chronicle warns of\n", "ETERNATUS, who brought the darkness.\r",
              "It waits in the depths of\n", "Kanto’s Victory Road.\r"]
  Calyrex: ["CALYREX, the King of Bountiful\n", "Harvests, waits on Route 22.\r"]
  Glastrier: ["GLASTRIER: it runs\n", "free all over Kanto.\r"]
  Spectrier: ["SPECTRIER: it runs\n", "free all over Kanto.\r"]
  Kubfu: ["KUBFU: training in Saffron’s\n", "Fighting Dojo.\r"]
  Zarude: ["ZARUDE: in the tall grass of\n", "Route 14.\r"]
  Regieleki: ["REGIELEKI: inside the Power Plant\n", "on Route 10.\r"]
  Regidrago: ["REGIDRAGO: on Route 28, by\n", "Mt. Silver.\r"]
  ZeraoraRelease: ["The Chronicle also tells of\n", "ZERAORA, who moves like lightning.\r",
                   "It never stays in one place.\n", "Look for it all over Kanto!\r"]
  SteedsRelease: ["With their king caught, GLASTRIER\n", "and SPECTRIER have bolted!\r",
                  "They run all over Kanto now.\n", "Catch one and join it to the king!\r"]
